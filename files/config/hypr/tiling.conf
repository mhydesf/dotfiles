# Kill window
bind = $mainMod, Q, killactive,

# Close windows
bindd = CTRL ALT, DELETE, Close all windows, exec, ~/.local/bin/close-all-windows

# Fullscreen
bindd = $mainMod, F, Full width, fullscreen, 1
bindd = $mainMod CTRL, F, Full screen, fullscreen, 0

# Control tiling
bindd = $mainMod CTRL, T, Toggle window floating/tiling, togglefloating,

# Move focus with $mainMod + arrow keys
bindd = $mainMod, H, Move window focus left, movefocus, l
bindd = $mainMod, L, Move window focus right, movefocus, r
bindd = $mainMod, K, Move window focus up, movefocus, u
bindd = $mainMod, J, Move window focus down, movefocus, d

# Switch workspaces with $mainMod + [1-9; 0]
bindd = $mainMod, code:10, Switch to workspace 1, workspace, 1
bindd = $mainMod, code:11, Switch to workspace 2, workspace, 2
bindd = $mainMod, code:12, Switch to workspace 3, workspace, 3
bindd = $mainMod, code:13, Switch to workspace 4, workspace, 4
bindd = $mainMod, code:14, Switch to workspace 5, workspace, 5
bindd = $mainMod, code:15, Switch to workspace 6, workspace, 6
bindd = $mainMod, code:16, Switch to workspace 7, workspace, 7
bindd = $mainMod, code:17, Switch to workspace 8, workspace, 8

# Move active window silently to a workspace with $mainMod + SHIFT + ALT + [1-9; 0]
bindd = $mainMod SHIFT, code:10, Move window silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod SHIFT, code:11, Move window silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod SHIFT, code:12, Move window silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod SHIFT, code:13, Move window silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod SHIFT, code:14, Move window silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod SHIFT, code:15, Move window silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod SHIFT, code:16, Move window silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod SHIFT, code:17, Move window silently to workspace 8, movetoworkspacesilent, 8

# Move active window to a workspace with $mainMod + SHIFT + [1-9; 0]
bindd = $mainMod CTRL, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod CTRL, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod CTRL, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod CTRL, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod CTRL, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod CTRL, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod CTRL, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod CTRL, code:17, Move window to workspace 8, movetoworkspace, 8

# TAB between workspaces
bindd = $mainMod, TAB, Next workspace, workspace, e+1
bindd = $mainMod SHIFT, TAB, Previous workspace, workspace, e-1
bindd = $mainMod CTRL, TAB, Former workspace, workspace, previous

# Move workspaces to other monitors
bindd = $mainMod SHIFT, LEFT, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod SHIFT, RIGHT, Move workspace to right monitor, movecurrentworkspacetomonitor, r

# Swap active window with the one next to it with $mainMod + SHIFT + arrow keys
bindd = $mainMod SHIFT, H, Swap window to the left, swapwindow, l
bindd = $mainMod SHIFT, L, Swap window to the right, swapwindow, r
bindd = $mainMod SHIFT, K, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, J, Swap window down, swapwindow, d

# Resize Active Window
bind = $mainMod, R, submap, resize
submap = resize
bind = , H, resizeactive, -25 0
bind = , L, resizeactive,  25 0
bind = , K, resizeactive,  0 -25
bind = , J, resizeactive,  0 25
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Move/resize windows with mainMod + LMB/RMB and dragging
bindmd = $mainMod, mouse:272, Move window, movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow
