###################
### MY PROGRAMS ###
###################
$terminal    = kitty
$fileManager = thunar
$menu        = rofi -show drun
$mainMod     = ALT

#################
### AUTOSTART ###
#################
exec-once = eww daemon --config ~/.config/eww

exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

################
### MONITORS ###
################
monitor=,preferred,auto,1

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 2.5
    gaps_out = 2.5
    border_size = 3

    col.active_border = rgba(9A90B8FF)
    col.inactive_border = rgba(2B2B2BFF)

    layout = dwindle
}

dwindle {
    pseudotile = true
    preserve_split = true
}

decoration {
    rounding = 7
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

###################
### KEYBINDINGS ###
###################

# Terminal
bind = $mainMod, Return, exec, $terminal

# Launcher
bind = $mainMod, space, exec, $menu

bind = $mainMod, E, exec, $fileManager

# Reload / Exit
bind = $mainMod SHIFT, C, exec, hyprctl reload
# Exit with a basic guard
bind = $mainMod SHIFT, E, exec, sh -c 'command -v wlogout >/dev/null 2>&1 && wlogout || hyprctl dispatch exit'

# Screenshot
# Fullscreen screenshot to ~/Pictures
bind = , Print, exec, hyprshot -m region --clipboard-only

# Select area and send to clipboard + swappy editor
bind = SHIFT, Print, exec, hyprshot -m window --clipboard-only

# Current window to clipboard
bind = CTRL, Print, exec, hyprshot -m output --clipboard-only ``` :contentReference[oaicite:0]{index=0}  

# Kill window
bind = $mainMod, Q, killactive,

# Focus
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Move window
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Focus/move to output
bind = $mainMod, left, focusmonitor, l
bind = $mainMod, right, focusmonitor, r
bind = $mainMod SHIFT, left, movewindow, mon:l
bind = $mainMod SHIFT, right, movewindow, mon:r

# Split containers
# Vertical split feel -> place next window above/below:
bind = $mainMod, V, layoutmsg, preselect d
# Horizontal split feel -> place next window left/right:
bind = $mainMod, B, layoutmsg, preselect r

# Fullscreen
bind = $mainMod, F, fullscreen, 0

# Focus parent
bind = $mainMod, A, cyclenext,

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8

# Resize mode
bind = $mainMod, R, submap, resize
submap = resize
bind = , H, resizeactive, -25 0
bind = , L, resizeactive,  25 0
bind = , K, resizeactive,  0 -25
bind = , J, resizeactive,  0 25
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, S, togglefloating

# Lock
bind = $mainMod SHIFT, L, exec, hyprlock

# Notifications
# Toggle notification center
bind = $mainMod, N, exec, swaync-client -t

# Close all notifications
bind = $mainMod SHIFT, N, exec, swaync-client -C

# Dismiss latest notification
bind = $mainMod, D, exec, swaync-client -d

# Toggle do-not-disturb
bind = $mainMod, M, exec, swaync-client -D

############################
### MEDIA / BRIGHTNESS   ###
############################
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

################################
### WINDOW / WORKSPACE RULES ###
################################
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

###################
###   INPUTS    ###
###################
input {
  kb_options = caps:swapescape
  kb_layout = us
  follow_mouse = 1
  sensitivity = 0
  touchpad {
    natural_scroll = true
    tap-to-click = false
    clickfinger_behavior = true
  }
}

###################
### ANIMATIONS  ###
###################
animations {
    enabled = true

    # Overall feel
    bezier = fast, 0.2, 0.9, 0.2, 1.0

    # Faster values = shorter duration (first number)
    # Format: animation = <name>, <enabled>, <duration>, <bezier>, <style>
    animation = windows, 1, 1.0, fast, popin 85%
    animation = windowsOut, 1, 1.0, fast, popin 85%
    animation = border, 1, 1.0, fast
    animation = fade, 1, 1.0, fast
    animation = workspaces, 1, 1.0, fast, slide
}
