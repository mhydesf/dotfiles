# Reload / Exit
bind = $mainMod, C, exec, hyprctl reload
bind = $mainMod CTRL, E, exec, sh -c 'command -v wlogout >/dev/null 2>&1 && wlogout || hyprctl dispatch exit'
bind = $mainMod CTRL, L, exec, hyprlock

bindd = $mainMod CTRL, B, Bluetooth, exec, ~/.local/bin/launch-tui bluetui
bindd = $mainMod CTRL, N, Network, exec, ~/.local/bin/launch-tui impala

# Screenshot
bind = , Print, exec, hyprshot -m region --clipboard-only
bind = SHIFT, Print, exec, hyprshot -m window --clipboard-only
bind = CTRL, Print, exec, hyprshot -m output --clipboard-only ``` :contentReference[oaicite:0]{index=0}  

# Media
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Launchers
bind = $mainMod, space, exec, $menu
bind = $mainMod, Return, exec, $terminal
bind = $mainMod SHIFT, F, exec, $fileManager

bindd = $mainMod SHIFT, B, Browser, exec, $browser
bindd = $mainMod SHIFT, M, Music, exec, youtube-music-desktop-app
bindd = $mainMod SHIFT, A, ChatGPT, exec, ~/.local/bin/launch-webapp "https://chatgpt.com"
bindd = $mainMod SHIFT, Y, YouTube, exec, ~/.local/bin/launch-webapp "https://youtube.com/"
bindd = $mainMod SHIFT, D, Discord, exec, discord
bindd = $mainMod SHIFT, S, Steam, exec, steam
bindd = $mainMod SHIFT, T, Activity, exec, ~/.local/bin/launch-tui-tile btop
bindd = $mainMod SHIFT, E, Email, exec, ~/.local/bin/launch-webapp "https://gmail.com"

# Notifications
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod SHIFT, N, exec, swaync-client -C
bind = $mainMod, D, exec, swaync-client -d
bind = $mainMod, M, exec, swaync-client -D
