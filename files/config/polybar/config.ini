[colors]
background     = #1A1A1A
background-alt = #242424
foreground     = #E7E7F2
foreground-alt = #BCB9D4

primary        = #9A88C0   ; brighter, more expressive violet
secondary      = #7C6A98   ; softer but still lively
alert          = #C97A7A   ; refined muted red
disabled       = #686477

[bar/example]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "RobotoMono Nerd Font:size=11;3"

tray-position = right
tray-padding  = 0
tray-maxsize  = 18

modules-left = xworkspaces
modules-right = filesystem pulseaudio memory cpu wlan eth date battery systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
bottom = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline  = ${colors.primary}
label-active-padding    = 1

label-occupied = %name%
label-occupied-foreground = ${colors.foreground-alt}
label-occupied-padding    = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.foreground}
label-urgent-padding    = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding    = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

; Icon in primary violet, text in normal foreground
label-mounted = %{F#9A88C0}%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-alt}

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2

format-prefix = "󱤓 "
format-prefix-foreground = ${colors.primary}

label = %percentage_used:2%%
label-foreground = ${colors.foreground-alt}

warn-percentage = 75
label-warn-foreground = ${colors.secondary}
format-warn-prefix-foreground = ${colors.secondary}

crit-percentage = 90
label-crit-foreground = ${colors.alert}
format-crit-prefix-foreground = ${colors.alert}

[module/cpu]
type = internal/cpu
interval = 2

format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}

label = %percentage:2%%
label-foreground = ${colors.foreground-alt}

warn-percentage = 70
label-warn-foreground = ${colors.secondary}
format-warn-prefix-foreground = ${colors.secondary}

crit-percentage = 90
label-crit-foreground = ${colors.alert}
format-crit-prefix-foreground = ${colors.alert}

[network-base]
type = internal/network
interval = 5

; These will be reused by wlan/eth
format-connected    = <label-connected>
format-disconnected = <label-disconnected>

; Interface name in violet, "disconnected" in disabled gray
label-disconnected = %{F#9A88C0}%ifname%%{F#686477} disconnected%{F-}

[module/wlan]
inherit = network-base
interface-type = wireless
interface = wlp2s0f0 

; Show signal icon + SSID + IP
format-connected = <ramp-signal> <label-connected>
label-connected  = %essid% %local_ip%

; Signal strength icon ramp with themed colors
ramp-signal-0 = %{F#C97A7A}󰤯%{F-}  ; very weak / bad (alert)
ramp-signal-1 = %{F#7C6A98}󰤟%{F-}
ramp-signal-2 = %{F#9A88C0}󰤢%{F-}
ramp-signal-3 = %{F#9A88C0}󰤥%{F-}
ramp-signal-4 = %{F#9A88C0}󰤨%{F-}  ; excellent

[module/eth]
inherit = network-base
interface-type = wired
; Or explicit:
; interface = enp3s0

; Ethernet icon + IP
label-connected = %{F#9A88C0}󰈀%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %I:%M %p
date-alt = %A, %B %d %Y  %I:%M:%S %p

label = %date%
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 98
low-at = 20
poll-interval = 10

format-charging    = %{F#9A88C0}%{F-} <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full        = <ramp-capacity> <label-full>
format-low         = <ramp-capacity> <label-low>

label-discharging = %percentage%%
label-charging    = %percentage%%
label-full        = %percentage%%
label-low         = %percentage%%

label-discharging-foreground = ${colors.foreground-alt}
label-charging-foreground    = ${colors.primary}
label-full-foreground        = ${colors.secondary}
label-low-foreground         = ${colors.alert}

ramp-capacity-0 = ""
ramp-capacity-1 = ""
ramp-capacity-2 = ""
ramp-capacity-3 = ""
ramp-capacity-4 = ""

ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.secondary}
ramp-capacity-2-foreground = ${colors.primary}
ramp-capacity-3-foreground = ${colors.primary}
ramp-capacity-4-foreground = ${colors.secondary}

animation-charging-0 = ""
animation-charging-1 = ""
animation-charging-2 = ""
animation-charging-3 = ""
animation-charging-4 = ""
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini

