- defaults:
    link:
        relink: true
        create: true
        force: true

- clean: ['~']

- link:
    ~/.tmux.conf: files/tmux.conf
    ~/.config/nvim: files/config/nvim
    ~/.config/kitty: files/config/kitty
    ~/.config/i3: files/config/i3
    ~/.config/dunst/: files/config/dunst
    ~/.config/polybar/: files/config/polybar
    ~/.config/picom/: files/config/picom
    ~/.config/rofi/: files/config/rofi
    ~/.shell: files/shell
    ~/.vimrc: files/vimrc
    ~/.bashrc: files/bashrc
    ~/.bash_aliases: files/bash_aliases

- create:
    - ~/.vim/undo-history

- shell:
    - [git submodule update --init --recursive, Installing submodules]

